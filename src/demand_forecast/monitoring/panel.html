<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colombia demand forecast: live panel</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --good: #0ca30c; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5; --series-2: #d95926;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 17px; margin: 0; }
p { margin: 0; }
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
.top { display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-end; gap: 8px 24px; }
.top h1 { flex: 1 1 320px; }
.lang {
  display: inline-flex; align-items: center; gap: 6px; flex: none; font: inherit; font-size: 13px;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 12px; cursor: pointer;
}
.lang:hover { color: var(--ink); border-color: var(--axis); }
.lang:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.lang svg { flex: none; }
.lede { color: var(--ink-2); max-width: 70ch; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 28px 0 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 32px; font-weight: 600; line-height: 1.2; margin: 4px 0; }
.tile .note { color: var(--ink-2); font-size: 13px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.status svg { flex: none; }
section.card { margin-top: 12px; }
.subtitle { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 4px; font-size: 13px; color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend[hidden] { display: none; }
.key-line { width: 16px; height: 2px; border-radius: 1px; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--series-1); outline-offset: 4px; border-radius: 4px; }
.chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tooltip {
  position: absolute; top: 8px; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 150px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
}
.tooltip[hidden] { display: none; }
.tooltip .when { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .row { display: flex; align-items: center; gap: 8px; }
.tooltip .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip .row .name { color: var(--ink-2); margin-left: auto; padding-left: 12px; }
.empty { color: var(--ink-2); padding: 28px 0 12px; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { color: var(--ink-2); font-weight: 500; }
.prose p + p { margin-top: 8px; }
.prose { color: var(--ink-2); max-width: 78ch; margin-top: 8px; }
footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1 data-t="h1"></h1>
      <button type="button" class="lang" id="lang">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2 11 0 13M8 1.5c-2 2-2 11 0 13"/>
        </svg>
        <span id="lang-name"></span>
      </button>
    </div>
    <p class="lede" data-t="lede"></p>
    <nav class="links" id="links"></nav>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2 data-t="hourly_title"></h2>
    <p class="subtitle" id="hourly-subtitle"></p>
    <div class="legend" id="hourly-legend">
      <span><i class="key-line" style="background: var(--series-1)"></i><span data-t="forecast"></span></span>
      <span><i class="key-line" style="background: var(--series-2)"></i><span data-t="actual"></span></span>
    </div>
    <div class="chart" id="hourly-chart"></div>
    <details>
      <summary data-t="table_summary"></summary>
      <div class="table-wrap"><table id="days-table"></table></div>
      <p class="subtitle" id="hourly-source"></p>
    </details>
  </section>

  <section class="card">
    <h2 data-t="error_title"></h2>
    <p class="subtitle" data-t="error_subtitle"></p>
    <div class="legend" id="error-legend">
      <span><i class="key-rect" style="background: var(--series-1)"></i><span data-t="day_mape"></span></span>
      <span><i class="key-line" style="background: var(--series-2)"></i><span data-t="cumulative_mape"></span></span>
    </div>
    <div class="chart" id="error-chart"></div>
  </section>

  <section class="card">
    <h2 data-t="drift_title"></h2>
    <div class="prose" id="drift"></div>
  </section>

  <section class="card">
    <h2 data-t="how_title"></h2>
    <div class="prose">
      <p data-t="how_log"></p>
      <p data-t="how_backtest"></p>
    </div>
  </section>

  <footer id="footer"></footer>
</main>

<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const TEXT = JSON.parse(document.getElementById("text").textContent);
  const SVG = "http://www.w3.org/2000/svg";
  const STORAGE_KEY = "panel-language";
  const METHODS = { "Wasserstein distance (normed)": "method_wasserstein" };
  const zone = D.timezone;
  const asDay = (text) => new Date(text + "T12:00:00-05:00");
  const observers = [];

  function el(tag, attrs = {}, text) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function svg(tag, attrs = {}, text) {
    const node = document.createElementNS(SVG, tag);
    for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ---- Language ---------------------------------------------------------------
  function stored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
  }
  function initialLanguage() {
    const asked = new URLSearchParams(location.search).get("lang");
    if (asked in TEXT) return asked;
    const saved = stored();
    if (saved in TEXT) return saved;
    return (navigator.languages || [navigator.language || "en"]).some((code) => /^es\b/i.test(code)) ? "es" : "en";
  }
  function choose(language) {
    try { localStorage.setItem(STORAGE_KEY, language); } catch { /* the choice still applies to this visit */ }
    const url = new URL(location.href);
    url.searchParams.set("lang", language);
    history.replaceState(null, "", url);
    render(language);
  }
  const otherLanguage = (language) => Object.keys(TEXT).find((code) => code !== language);
  document.getElementById("lang").addEventListener("click", () => choose(otherLanguage(document.documentElement.lang)));

  // ---- Chart ------------------------------------------------------------------
  function niceTicks(low, high, count) {
    const span = high - low || 1;
    const step0 = Math.pow(10, Math.floor(Math.log10(span / count)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * step0).find((s) => span / s <= count) || step0 * 10;
    const first = Math.floor(low / step) * step;
    const ticks = [];
    for (let value = first; value < high + step * 0.999; value += step) ticks.push(+value.toFixed(10));
    return ticks;
  }

  // cfg: { count, when(i), ticks: [{ i, label }], series: [{ name, type, color, values }],
  //        zero, format(value, full), extra(i), reference: { value, label } | null, label }
  function chart(host, cfg) {
    const tooltip = el("div", { class: "tooltip", hidden: "" });
    let active = null;

    function draw() {
      host.replaceChildren();
      const width = Math.max(host.clientWidth, 280);
      const height = 300;
      const pad = { top: 12, right: 12, bottom: 28, left: 44 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const all = cfg.series.flatMap((s) => s.values.filter((v) => v !== null));
      if (cfg.reference) all.push(cfg.reference.value);
      const ticks = niceTicks(cfg.zero ? 0 : Math.min(...all), Math.max(...all), 5);
      const low = ticks[0];
      const high = ticks[ticks.length - 1];
      const band = plotW / cfg.count;
      const x = (i) => pad.left + band * (i + 0.5);
      const y = (value) => pad.top + plotH * (1 - (value - low) / (high - low));

      const root = svg("svg", { viewBox: `0 0 ${width} ${height}`, height, tabindex: 0, role: "img", "aria-label": cfg.label });
      for (const value of ticks) {
        root.append(svg("line", { x1: pad.left, x2: width - pad.right, y1: y(value), y2: y(value), stroke: value === low ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        root.append(svg("text", { x: pad.left - 8, y: y(value) + 4, "text-anchor": "end" }, cfg.format(value)));
      }
      const every = Math.max(1, Math.ceil(cfg.ticks.length / Math.max(2, Math.floor(plotW / 78))));
      cfg.ticks.forEach((tick, index) => {
        if (index % every) return;
        root.append(svg("text", { x: x(tick.i), y: height - 8, "text-anchor": "middle" }, tick.label));
      });

      for (const series of cfg.series) {
        if (series.type === "column") {
          const w = Math.max(2, Math.min(24, band - 2));
          series.values.forEach((value, i) => {
            if (value === null) return;
            const top = y(value);
            const base = y(low);
            const r = Math.min(4, w / 2, Math.max(0, base - top));
            const left = x(i) - w / 2;
            root.append(svg("path", {
              d: `M${left} ${base} V${top + r} Q${left} ${top} ${left + r} ${top} H${left + w - r} Q${left + w} ${top} ${left + w} ${top + r} V${base} Z`,
              fill: series.color, "data-index": i, class: "mark",
            }));
          });
        } else {
          let path = "";
          let open = false;
          series.values.forEach((value, i) => {
            if (value === null) { open = false; return; }
            path += `${open ? "L" : "M"}${x(i).toFixed(1)} ${y(value).toFixed(1)} `;
            open = true;
          });
          root.append(svg("path", { d: path, fill: "none", stroke: series.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
          if (series.values.filter((v) => v !== null).length === 1) {
            const i = series.values.findIndex((v) => v !== null);
            root.append(svg("circle", { cx: x(i), cy: y(series.values[i]), r: 4, fill: series.color, stroke: "var(--surface)", "stroke-width": 2 }));
          }
        }
      }
      if (cfg.reference) {
        const at = y(cfg.reference.value);
        root.append(svg("line", { x1: pad.left, x2: width - pad.right, y1: at, y2: at, stroke: "var(--muted)", "stroke-width": 1 }));
        const label = svg("text", { x: width - pad.right, y: at - 6, "text-anchor": "end" }, cfg.reference.label);
        label.style.fill = "var(--ink-2)";
        label.style.paintOrder = "stroke";
        label.style.stroke = "var(--surface)";
        label.style.strokeWidth = "4px";
        label.style.strokeLinejoin = "round";
        root.append(label);
      }

      const cross = svg("line", { y1: pad.top, y2: pad.top + plotH, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
      const dots = cfg.series.map((series) => svg("circle", { r: 4, fill: series.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
      root.append(cross, ...dots);

      function show(i) {
        active = Math.max(0, Math.min(cfg.count - 1, i));
        cross.setAttribute("x1", x(active));
        cross.setAttribute("x2", x(active));
        cross.setAttribute("visibility", "visible");
        tooltip.replaceChildren(el("div", { class: "when" }, cfg.when(active)));
        cfg.series.forEach((series, index) => {
          const value = series.values[active];
          const dot = dots[index];
          if (value === null) { dot.setAttribute("visibility", "hidden"); return; }
          dot.setAttribute("cx", x(active));
          dot.setAttribute("cy", y(value));
          dot.setAttribute("visibility", "visible");
          const row = el("div", { class: "row" });
          const key = el("i", { class: "key-line" });
          key.style.background = series.color;
          row.append(key, el("b", {}, cfg.format(value, true)), el("span", { class: "name" }, series.name));
          tooltip.append(row);
        });
        if (cfg.extra) {
          const text = cfg.extra(active);
          if (text) tooltip.append(el("div", { class: "when" }, text));
        }
        tooltip.hidden = false;
        const box = tooltip.offsetWidth;
        const left = x(active) + 12 + box > width ? x(active) - 12 - box : x(active) + 12;
        tooltip.style.left = Math.max(0, left) + "px";
      }
      function hide() {
        active = null;
        cross.setAttribute("visibility", "hidden");
        dots.forEach((dot) => dot.setAttribute("visibility", "hidden"));
        tooltip.hidden = true;
      }
      const hit = svg("rect", { x: pad.left, y: pad.top, width: plotW, height: plotH, fill: "transparent" });
      hit.addEventListener("pointermove", (event) => {
        const bounds = root.getBoundingClientRect();
        const px = (event.clientX - bounds.left) * (width / bounds.width);
        show(Math.floor((px - pad.left) / band));
      });
      hit.addEventListener("pointerleave", hide);
      root.addEventListener("focus", () => show(active === null ? cfg.count - 1 : active));
      root.addEventListener("blur", hide);
      root.addEventListener("keydown", (event) => {
        const step = { ArrowLeft: -1, ArrowRight: 1, PageUp: -24, PageDown: 24 }[event.key];
        if (event.key === "Escape") hide();
        if (!step) return;
        event.preventDefault();
        show((active === null ? cfg.count - 1 : active) + step);
      });
      root.append(hit);
      host.append(root, tooltip);
    }

    draw();
    let lastWidth = host.clientWidth;
    const observer = new ResizeObserver(() => {
      if (host.clientWidth === lastWidth) return;
      lastWidth = host.clientWidth;
      draw();
    });
    observer.observe(host);
    observers.push(observer);
  }

  // ---- Page, in one language ------------------------------------------------------
  function render(language) {
    const T = TEXT[language];
    const t = (key, vars = {}) => T[key].replace(/\{(\w+)\}/g, (_, name) => vars[name]);
    const plural = (key, n, vars = {}) => t(key + (n === 1 ? "_one" : "_other"), { n, ...vars });
    const fixed = (value, digits) => value.toLocaleString(T.locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    const compact = (value) => value.toLocaleString(T.locale, { maximumFractionDigits: 2 });
    const percent = (value) => t("percent", { value: fixed(value, 2) });
    const dates = (options) => new Intl.DateTimeFormat(T.locale, { timeZone: zone, ...options });
    const shortDay = dates({ day: "numeric", month: "short" });
    const fullDay = dates({ day: "numeric", month: "short", year: "numeric" });
    const weekDay = dates({ weekday: "short", day: "numeric", month: "short" });
    const weekDayYear = dates({ weekday: "short", day: "numeric", month: "short", year: "numeric" });
    const hourFormat = dates({ weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const moment = dates({ day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const dayType = (name) => T["day_" + name] || name;

    document.documentElement.lang = language;
    document.title = T.title;
    for (const node of document.querySelectorAll("[data-t]")) node.textContent = T[node.dataset.t];
    const offered = otherLanguage(language);
    const offeredName = document.getElementById("lang-name");
    offeredName.textContent = TEXT[offered].language_name;
    offeredName.lang = offered;
    observers.splice(0).forEach((observer) => observer.disconnect());

    // Links, tiles and footer
    const links = document.getElementById("links");
    links.replaceChildren();
    for (const [key, href] of [["link_repo", D.links.repo], ["link_api", D.links.api], ["link_log", D.links.log]]) {
      links.append(el("a", { href }, T[key]));
    }

    function tile(label, value, note, status) {
      const card = el("div", { class: "card tile" });
      card.append(el("div", { class: "label" }, label), el("div", { class: "value" }, value));
      if (status) {
        const line = el("div", { class: "status" });
        const icon = svg("svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" });
        icon.append(status.ok
          ? svg("circle", { cx: 6, cy: 6, r: 5, fill: "var(--good)" })
          : svg("path", { d: "M6 1 L11 11 H1 Z", fill: "var(--critical)" }));
        line.append(icon, document.createTextNode(status.text));
        card.append(line);
      }
      card.append(el("div", { class: "note" }, note));
      return card;
    }

    const tiles = document.getElementById("tiles");
    tiles.replaceChildren();
    const backtest = D.backtest;
    const threshold = percent(D.alert_threshold);
    if (D.live) {
      tiles.append(tile(T.tile_live, percent(D.live.mape), plural("tile_live_note", D.live.evaluated_days, {
        first: shortDay.format(asDay(D.live.first_day)), last: shortDay.format(asDay(D.live.last_day)),
      })));
    } else {
      tiles.append(tile(T.tile_live, "–", T.tile_live_empty));
    }
    if (D.live && D.live.recent_mape !== null) {
      const ok = D.live.recent_mape <= D.alert_threshold;
      tiles.append(tile(t("tile_recent", { n: D.live.recent_days }), percent(D.live.recent_mape),
        t("tile_recent_note", { threshold }), { ok, text: ok ? T.status_ok : T.status_alert }));
    } else {
      tiles.append(tile(t("tile_recent", { n: D.recent_days }), "–", t("tile_recent_empty", { n: D.recent_days, threshold })));
    }
    tiles.append(tile(T.tile_backtest, percent(backtest.mape), t("tile_backtest_note", {
      start: fullDay.format(asDay(backtest.start)), end: fullDay.format(asDay(backtest.end)),
      baseline: percent(backtest.best_baseline_mape),
    })));
    if (D.latest) {
      tiles.append(tile(T.tile_latest, fixed(D.latest.total_gwh, 1) + " GWh", t("tile_latest_note", {
        day: weekDay.format(asDay(D.latest.target_day)), moment: moment.format(new Date(D.latest.issued_at)),
      })));
    } else {
      tiles.append(tile(T.tile_latest, "–", T.tile_latest_empty));
    }

    document.getElementById("footer").textContent =
      t("footer", { moment: moment.format(new Date(D.generated_at)), model: D.model_version });

    // Forecast and actual, hourly
    const hours = D.hourly;
    const hourlyHost = document.getElementById("hourly-chart");
    hourlyHost.replaceChildren();
    document.getElementById("hourly-legend").hidden = !hours.length;
    document.getElementById("hourly-subtitle").textContent = hours.length ? plural("hourly_subtitle", hours.length / 24) : "";
    if (hours.length) {
      const times = hours.map((row) => new Date(row[0]));
      const ticks = [];
      hours.forEach((row, i) => { if (row[0].slice(11, 13) === "00") ticks.push({ i: i + 12, label: shortDay.format(times[i]) }); });
      chart(hourlyHost, {
        label: T.hourly_label,
        count: hours.length,
        when: (i) => hourFormat.format(times[i]),
        ticks: ticks.map((tick) => ({ i: Math.min(tick.i, hours.length - 1), label: tick.label })),
        series: [
          { name: T.forecast, type: "line", color: "var(--series-1)", values: hours.map((row) => row[1]) },
          { name: T.actual, type: "line", color: "var(--series-2)", values: hours.map((row) => row[2]) },
        ],
        zero: false,
        format: (value, full) => (full ? fixed(value, 2) + " GWh" : compact(value)),
        extra: (i) => (hours[i][2] === null ? T.tooltip_pending
          : t("tooltip_error", { value: percent(Math.abs(hours[i][1] - hours[i][2]) / hours[i][2] * 100) })),
        reference: null,
      });
    } else {
      hourlyHost.append(el("p", { class: "empty" }, T.hourly_empty));
    }

    // Table of days
    const table = document.getElementById("days-table");
    table.replaceChildren();
    const head = el("tr");
    for (const key of ["col_day", "col_type", "col_forecast", "col_actual", "col_mape"]) head.append(el("th", { scope: "col" }, T[key]));
    table.append(head);
    for (const row of [...D.days].reverse()) {
      const line = el("tr");
      line.append(
        el("td", {}, weekDayYear.format(asDay(row.day))),
        el("td", {}, dayType(row.day_type)),
        el("td", {}, fixed(row.predicted_gwh, 1)),
        el("td", {}, row.actual_gwh === null ? T.pending : fixed(row.actual_gwh, 1)),
        el("td", {}, row.mape === null ? T.pending : percent(row.mape)),
      );
      table.append(line);
    }
    document.getElementById("hourly-source").replaceChildren(
      T.source_before, el("a", { href: D.links.log }, T.source_link), T.source_after);

    // Error by day
    const scored = D.days.filter((row) => row.mape !== null);
    const errorHost = document.getElementById("error-chart");
    errorHost.replaceChildren();
    document.getElementById("error-legend").hidden = !scored.length;
    if (scored.length) {
      chart(errorHost, {
        label: T.error_label,
        count: scored.length,
        when: (i) => weekDay.format(asDay(scored[i].day)) + " · " + dayType(scored[i].day_type),
        ticks: scored.map((row, i) => ({ i, label: shortDay.format(asDay(row.day)) })),
        series: [
          { name: T.day_mape, type: "column", color: "var(--series-1)", values: scored.map((row) => row.mape) },
          { name: T.cumulative_mape, type: "line", color: "var(--series-2)", values: scored.map((row) => row.cumulative_mape) },
        ],
        zero: true,
        format: (value, full) => (full ? percent(value) : t("percent", { value: compact(value) })),
        reference: { value: backtest.mape, label: t("reference_backtest", { value: percent(backtest.mape) }) },
      });
    } else {
      errorHost.append(el("p", { class: "empty" }, T.error_empty));
    }

    // Drift
    const drift = document.getElementById("drift");
    drift.replaceChildren();
    if (D.drift) {
      const method = METHODS[D.drift.method];
      drift.append(el("p", {}, plural("drift_summary", D.drift.current_days, {
        count: D.drift.drifted.length, total: Object.keys(D.drift.scores).length,
        start: D.drift.reference_start, end: D.drift.reference_end,
        quantile: Math.round(D.drift.quantile * 100), method: method ? T[method] : D.drift.method,
      })));
      if (D.drift.drifted.length) drift.append(el("p", {}, t("drift_list", { names: D.drift.drifted.join(", ") })));
      const more = el("p");
      more.append(el("a", { href: "drift.html" }, T.drift_link));
      drift.append(more);
    } else {
      drift.append(el("p", {}, t("drift_empty", { n: D.drift_min_days })));
    }
  }

  render(initialLanguage());
})();
</script>
