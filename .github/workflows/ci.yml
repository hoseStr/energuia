name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --group monitoring
      - name: Lint
        run: uv run ruff check
      - name: Check the format
        run: uv run ruff format --check
      - name: Tests
        run: uv run pytest
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image
        run: docker build --tag demand-forecast:ci .
      - name: Start the container
        run: docker run --detach --name api --publish 8000:8000 demand-forecast:ci
      - name: Query the three endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:8000/health; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://localhost:8000/health
          curl --silent --show-error --fail http://localhost:8000/metrics
          # 503 is the right answer while the forecast log is still empty.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/forecast)
          echo "/forecast answered $status"
          test "$status" = 200 || test "$status" = 503
      - name: Show the container log
        if: always()
        run: docker logs api
