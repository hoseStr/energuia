name: Weekly retraining

on:
  schedule:
    # Sundays at 12:17 UTC (07:17 in Bogota), away from the daily job.
    - cron: "17 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Shared with the daily job: both push to main.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  retrain:
    name: Compare, promote if better and record the decision
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --no-dev

      - name: Retrain only if retraining beat the current model
        run: uv run --no-sync python -m demand_forecast.cli retrain

      - name: Commit the decision and, if promoted, the new model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit --message "chore: decisión de reentrenamiento del $(TZ=America/Bogota date +%F)"
          git push || { git pull --rebase && git push; }
