[project]
name = "demand-forecast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.108",
    "pandas>=3.0.3",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "typer>=0.29.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Phase 0 exploration scripts: local naive dates are intentional (measuring lag in Bogota time)
"explore/*" = ["DTZ", "E501"]
# Exploratory notebook: long f-strings in prints are fine
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
